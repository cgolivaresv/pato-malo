<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rastro Austral</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@700;800&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: mapa de seguimiento a la izquierda (arriba en teléfono), panel de expediente a la derecha. Un solo look nocturno de central policial. */
:root{
  --night:#121f33;      /* fondo */
  --sea:#0d1829;        /* océano del mapa */
  --land:#24364f;       /* tierra */
  --land-sa:#2d4462;    /* sudamérica */
  --land-cl:#3b5a7d;    /* chile */
  --panel:#192a43;      /* superficie */
  --line:#2c4263;       /* bordes */
  --ink:#e9eef5;        /* texto */
  --muted:#93a5bd;      /* texto secundario */
  --tape:#f4c430;       /* acento: cinta policial */
  --ok:#6fd39a; --bad:#ff7a6b;
  --f-display:"Big Shoulders Stencil Display", Impact, "Arial Narrow", sans-serif;
  --f-body:"Barlow", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
html,body{background:var(--night);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 28px}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--tape);outline-offset:2px}
a{color:var(--tape)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

header.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;margin-bottom:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:28px;letter-spacing:.04em;text-transform:uppercase;line-height:1;display:flex;align-items:center;gap:10px}
.brand i{display:inline-block;width:34px;height:12px;background:repeating-linear-gradient(-45deg,var(--tape) 0 6px,var(--night) 6px 12px);border-radius:2px}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 10px;min-width:92px}
.stat small{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.stat b{font-family:var(--f-mono);font-weight:500;font-size:14px;font-variant-numeric:tabular-nums}
.stat.warn b{color:var(--bad)}

.grid{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:920px){.grid{grid-template-columns:minmax(0,1.45fr) minmax(340px,1fr);align-items:start}.mapwrap{position:sticky;top:12px;height:calc(100vh - 110px)!important}}
.mapwrap{position:relative;height:42vh;min-height:240px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--sea)}
#map{width:100%;height:100%;display:block;touch-action:manipulation}
#map .o{fill:var(--land)} #map .sa{fill:var(--land-sa)} #map .lim{fill:var(--land-sa)} #map .cl{fill:var(--land-cl)}
#map .grat{stroke:#ffffff10;fill:none}
.mapctl{position:absolute;right:8px;bottom:8px;display:flex;gap:6px}
.mapctl button,.chip{background:#0d1829d9;border:1px solid var(--line);border-radius:6px;padding:5px 9px;font-size:12px}
.maptag{position:absolute;left:10px;top:8px;font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.05em}
.pulse{animation:pulse 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(3.2)}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none;opacity:.35}}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0}
.cityhead{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.cityhead .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.cityhead h2{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1;margin:4px 0 6px;text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
.links{display:flex;flex-wrap:wrap;gap:6px}
.links a{font-size:12.5px;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--ink)}
.links a:hover{border-color:var(--tape)}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:10px 4px;font-weight:600;color:var(--muted);font-size:14px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--tape)}
.tabs .n{font-family:var(--f-mono);font-size:11px;background:var(--line);border-radius:999px;padding:0 6px;margin-left:4px}
.tabbody{padding:14px 16px;display:flex;flex-direction:column;gap:10px}

.card{border:1px solid var(--line);border-radius:8px;padding:11px 12px;display:flex;flex-direction:column;gap:7px;background:#ffffff05}
.card .row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.card h3{margin:0;font-size:15.5px;font-weight:600}
.card .who{font-size:12.5px;color:var(--muted)}
.quote{border-left:3px solid var(--tape);padding:4px 0 4px 10px;font-size:14.5px}
.quote.dead{border-left-color:var(--muted);color:var(--muted)}
.quote.hot{border-left-color:var(--bad)}
.act{display:flex;flex-wrap:wrap;gap:6px}
.btn{background:var(--tape);color:#1a1405;border:0;border-radius:6px;padding:7px 12px;font-weight:600;font-size:13.5px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.cost{font-family:var(--f-mono);font-size:12px;opacity:.85;margin-left:4px}
.small{font-size:12.5px;color:var(--muted)}
.sec{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-top:6px}
.dest.sel{border-color:var(--tape)}
.dest .km{font-family:var(--f-mono);font-size:12px;color:var(--muted)}

.warrant{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.warrant label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.warrant select{background:var(--night);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px;font:inherit;font-size:13.5px}
.sus{display:flex;flex-wrap:wrap;gap:6px}
.sus span{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.sus span.on{border-color:var(--tape);color:var(--tape)}
.badge{font-family:var(--f-mono);font-size:11.5px;border-radius:4px;padding:1px 6px;background:var(--line)}
.badge.ok{background:#6fd39a26;color:var(--ok)} .badge.bad{background:#ff7a6b26;color:var(--bad)}
.log{display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.log div{display:grid;grid-template-columns:76px 1fr;gap:8px}
.log time{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);padding-top:2px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--night);padding:9px 14px;border-radius:8px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);z-index:30;box-shadow:0 6px 24px #0008}

.overlay{position:fixed;inset:0;background:#0a1220e6;z-index:20;overflow:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));display:flex;justify-content:center;align-items:flex-start}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:100%;max-width:660px;margin-top:4vh;overflow:hidden}
.modal .tape{height:14px;background:repeating-linear-gradient(-45deg,var(--tape) 0 14px,#16120a 14px 28px)}
.modal .in{padding:18px 20px 22px;display:flex;flex-direction:column;gap:12px}
.modal h1{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,7vw,48px);line-height:.95;margin:0;text-transform:uppercase;text-wrap:balance}
.modal p{margin:0;max-width:62ch}
.crimes{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.crime{text-align:left;background:#ffffff06;border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:6px}
.crime:hover{border-color:var(--tape)}
.crime b{font-size:16px}
.crime .meta{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.stars{color:var(--tape);letter-spacing:2px;font-size:12px}
.score{display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-size:14px}
.score .mono{text-align:right}
</style>

<header class="top">
  <div class="brand"><i aria-hidden="true"></i>Rastro Austral</div>
  <div class="stats" id="stats"></div>
</header>

<div class="grid">
  <div class="mapwrap">
    <svg id="map" role="img" aria-label="Mapa de seguimiento del sospechoso"></svg>
    <div class="maptag" id="maptag">CENTRAL · SEGUIMIENTO</div>
    <div class="mapctl"><button id="zRoute" type="button">Acercar</button><button id="zWorld" type="button">Mundo</button></div>
  </div>
  <section class="panel" id="panel"></section>
</div>

<div class="overlay" id="ov"></div>
<div class="toast" id="toast" hidden></div>

function dist(a,b){const R=6371,r=Math.PI/180,dl=(b.la-a.la)*r,dn=(b.lo-a.lo)*r;const h=Math.sin(dl/2)**2+Math.cos(a.la*r)*Math.cos(b.la*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}

function clock(h){const t=8+h,d=Math.floor(t/24),hh=Math.floor(t%24),mm=Math.round((t%1)*60)%60;return `${DAYS[d%7]} ${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`}

// ---------- GENERACIÓN DEL CASO ----------
function pool(scope,stage,total){
  if(scope==='cl')return CITIES.filter(c=>c.c==='CL');
  if(scope==='cono')return CITIES.filter(c=>CONO.includes(c.c));
  if(scope==='sa')return stage<=2?CITIES.filter(c=>CONO.includes(c.c)):CITIES.filter(inSA);
  if(stage<=2)return CITIES.filter(c=>CONO.includes(c.c));
  if(stage>=total-3)return CITIES.filter(c=>!inSA(c));
  return CITIES.filter(inSA);
}
function makeRoute(cr){
  const chile=CITIES.filter(c=>c.c==='CL'&&!c.air);
  const start=cr.start?CITY[pick(cr.start)]:pick(chile);
  const r=[start];
  for(let i=1;i<cr.stops;i++){
    const prev=r[i-1];
    let cand=pool(cr.scope,i,cr.stops).filter(c=>!r.includes(c)&&dist(prev,c)>260);
    if(cr.scope==='cono'&&i===cr.stops-1&&!r.some(c=>c.c!=='CL'))cand=cand.filter(c=>c.c!=='CL');
    r.push(pick(cand));
  }
  return r.map(c=>c.id);
}
function newCase(crimeId){
  const cr=CRIMES.find(c=>c.id===crimeId);
  const route=makeRoute(cr);
  const sus=pick(SUSPECTS);
  return {crime:cr.id,route,step:0,cur:route[0],path:[route[0]],hours:0,limit:cr.h,money:cr.money,awake:0,
    cities:{},sus:sus.id,traitQ:shuffle(TK),traitUsed:0,clues:[],log:[],warrant:null,sel:{veh:'',hob:'',sen:'',pel:''},
    deadEnds:0,tab:'inv',over:null,loot:pick(cr.loot),dest:null,opts:{}};
}

// ---------- ESTADO ----------
let S=null;
const crime=()=>CRIMES.find(c=>c.id===S.crime);
const routeIdx=id=>S.route.indexOf(id);
const isFinal=()=>S.cur===S.route[S.route.length-1]&&S.step===S.route.length-1;
const onRoute=()=>S.cur===S.route[S.step];

function nextTrait(){if(S.traitUsed>=TK.length)return null;const k=S.traitQ[S.traitUsed++];const s=SUSPECTS[S.sus];return {k,text:TRAITS[k].t[s.t[k]]}}
function destClue(fromId,toId,used){
  const to=CITY[toId],from=CITY[fromId],co=COUNTRIES[to.c];
  const opts=to.cl.filter(x=>!used.includes(x)).map(x=>({x,k:'city'}));
  if(to.c===from.c){opts.push({x:to.c==='CL'?'Pagó todo en pesos chilenos: no piensa salir del país.':`Dijo que se quedaba en ${co.n}.`,k:'country'})}
  else{opts.push({x:`Cambió todo su efectivo a ${co.m}.`,k:'country'},{x:`En la maleta asomaba una bandera ${co.f}.`,k:'country'});if(co.l)opts.push({x:`Practicaba frases en ${co.l}.`,k:'country'})}
  return opts;
}
function buildCity(id){
  if(S.cities[id])return S.cities[id];
  const c=CITY[id];
  let places=shuffle(PLACES.filter(p=>(!p.coast||c.coast)&&!(c.air&&p.t==='Terminal de buses'))).slice(0,3).map(p=>({...p,done:false,text:'',kind:''}));
  const i=routeIdx(id), cs={places,cam:null,inf:null,role:'dead'};
  if(i===S.step&&i>=0){
    if(i===S.route.length-1){
      cs.role='final';const hide=Math.floor(Math.random()*3);
      places.forEach((p,j)=>{if(j===hide){p.kind='hide'}else{p.kind='near';p.text=pick(['¡Pasó por aquí hace menos de una hora! Sigue en la ciudad.','Lo vi entrar al barrio hace un rato. Anda con cuidado, detective.','Preguntó por un lugar donde esconderse unos días. No ha salido de la ciudad.'])}});
    } else {
      cs.role='route';const nxt=S.route[i+1];const used=[];
      const a=pick(destClue(id,nxt,used).filter(o=>o.k==='city'));used.push(a.x);
      const b=pick(destClue(id,nxt,used));
      const tr=nextTrait();
      const pieces=shuffle([{kind:'dest',text:a.x},{kind:'dest',text:b.x},tr?{kind:'trait',text:tr.text}:{kind:'dest',text:pick(destClue(id,nxt,[a.x,b.x])).x}]);
      places.forEach((p,j)=>{p.kind=pieces[j].kind;p.text=pieces[j].text});
    }
  } else {
    places.forEach(p=>{p.kind='dead';p.text=pick(['Aquí no ha pasado nadie con esa descripción.','No sé de qué me habla, detective.','Hoy ha estado tranquilo; nada raro.','¿Una persona sospechosa? No, por acá no.'])});
  }
  S.cities[id]=cs;return cs;
}
function travelOptions(){
  if(S.opts[S.cur])return S.opts[S.cur];
  const cr=crime(),cur=CITY[S.cur];let list=[];
  if(onRoute()&&!isFinal()){
    const nxt=CITY[S.route[S.step+1]];list.push(nxt);
    const pl=pool(cr.scope,S.step+1,cr.stops).filter(c=>c!==cur&&c!==nxt&&!S.route.includes(c.id)&&dist(cur,c)>200);
    const same=shuffle(pl.filter(c=>c.c===nxt.c));
    if(same.length)list.push(same[0]);
    for(const c of shuffle(pl)){if(list.length>=4)break;if(!list.includes(c))list.push(c)}
  } else if(!onRoute()){
    list.push(CITY[S.route[S.step]]);
    const pl=pool(cr.scope,S.step+1,cr.stops).filter(c=>c!==cur&&!list.includes(c)&&!S.route.includes(c.id));
    list.push(...shuffle(pl).slice(0,2));
  }
  S.opts[S.cur]=shuffle(list).map(c=>c.id);return S.opts[S.cur];
}
function modes(from,to){
  const d=dist(from,to),cross=from.c!==to.c,out=[];
  const air={k:'air',n:'Avión',h:2.5+d/800+(d>4000?3:0)+(cross?1:0),m:50000+d*58};
  if(inSA(from)&&inSA(to)&&!from.air&&!to.air&&d<=3600){const road=d*1.3;out.push({k:'bus',n:'Bus',h:road/68+0.5+(cross?2:0),m:road*30})}
  out.push(air);return {d,out};
}

// ---------- ACCIONES ----------
function spend(h,m,label){
  S.hours+=h;S.money-=m;S.awake+=h;
  if(label)S.log.push({t:S.hours,x:label});
  if(S.awake>=18&&!S.over){const pay=Math.min(S.money,COST.sleep.m);S.hours+=COST.sleep.h;S.money-=pay;S.awake=0;S.log.push({t:S.hours,x:`Agotamiento: dormiste ${COST.sleep.h} h en un hostal (${money(pay)}).`});toast('El cansancio te ganó: 8 horas de sueño.')}
  checkEnd();
}
function canPay(m){return S.money>=m}
function visit(j){
  const cs=buildCity(S.cur),p=cs.places[j];if(p.done||S.over||!canPay(COST.visit.m))return;
  p.done=true;spend(COST.visit.h,COST.visit.m);if(S.over){render();return}

const svg=$('#map');let VB={x:0,y:0,w:MAP.W,h:MAP.H},anim=null;

function drawBase(){

  for(let lo=-180;lo<=180;lo+=30){const x=MAP.s*lo*Math.PI/180+MAP.tx;g+=`<line class="grat" x1="${x}" y1="0" x2="${x}" y2="${MAP.H}"/>`}

  g+='</g>';for(const k of ['o','sa','lim','cl'])g+=`<path class="${k}" d="${MAP.g[k]}"/>`;
  g+='<g id="ovl"></g>';svg.innerHTML=g;

function arc(a,b){const[x1,y1]=P(a),[x2,y2]=P(b);const mx=(x1+x2)/2,my=(y1+y2)/2,dx=x2-x1,dy=y2-y1;const k=.18;return `M${x1} ${y1}Q${mx-dy*k} ${my+dx*k} ${x2} ${y2}`}

    if(S.over){for(let i=1;i<S.route.length;i++)h+=`<path d="${arc(CITY[S.route[i-1]],CITY[S.route[i]])}" fill="none" stroke="#ff7a6b" stroke-width="${2.4*k}" opacity=".9"/>`}
    if(!S.over)for(const id of travelOptions()){const c=CITY[id],[x,y]=P(c),sel=S.dest===id;
      h+=`<g data-id="${id}" style="cursor:pointer"><circle cx="${x}" cy="${y}" r="${14*k}" fill="transparent"/><circle cx="${x}" cy="${y}" r="${5.5*k}" fill="${sel?'#f4c430':'#121f33'}" stroke="${sel?'#f4c430':'#e9eef5'}" stroke-width="${2*k}"/><text x="${x+8*k}" y="${y+4*k}" font-size="${11.5*k}" font-family="Barlow,sans-serif" font-weight="600" fill="#e9eef5" stroke="#0d1829" stroke-width="${3*k}" paint-order="stroke">${esc(c.n)}</text></g>`}

function fit(pts,minW){

function render(){

  <div class="tabbody">${body}</div>`;
