<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pato Malo</title>
  <meta name="description" content="Juego de escape: eres el prófugo y huyes de la PDI e Interpol por Chile, Sudamérica y el mundo.">
  <meta name="theme-color" content="#121016">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@700;800;900&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button class="brand" type="button" data-act="crimes" aria-label="Pato Malo: ver golpes">
        <img id="brandFace" alt="" width="34" height="34"><span>Pato Malo</span>
      </button>
      <button class="stats" id="stats" type="button" data-act="toggleStats" aria-expanded="false"></button>
      <button class="help" type="button" data-act="tutorial" aria-label="Ver el tutorial">?</button>
    </header>
    <div class="banner" id="banner" role="status" hidden></div>

    <main class="stage">
      <div class="mapwrap">
        <svg id="map" role="application" aria-label="Mapa de la fuga. Arrastra para moverlo, pellizca o usa la rueda para acercar, toca una ciudad para elegirla como destino."></svg>
        <svg class="compass" viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="32" cy="32" r="22" fill="none" stroke="currentColor" stroke-width="1" opacity=".45"/>
          <circle cx="32" cy="32" r="17" fill="none" stroke="currentColor" stroke-width=".8" stroke-dasharray="1.5 3" opacity=".45"/>
          <path d="M32 6L36 32L32 58L28 32Z" fill="currentColor" opacity=".35"/>
          <path d="M6 32L32 28L58 32L32 36Z" fill="currentColor" opacity=".25"/>
          <path d="M32 6L36 32H28Z" fill="#ff9a3c"/>
          <text x="32" y="5" text-anchor="middle" font-size="7.5" fill="currentColor" font-weight="700">N</text>
        </svg>
        <div class="mapctl">
          <button type="button" data-act="zoomIn" aria-label="Acercar">+</button>
          <button type="button" data-act="zoomOut" aria-label="Alejar">−</button>
          <button type="button" data-act="zoomMe" aria-label="Ir a tu posición"><span data-ico="target"></span></button>
          <button type="button" data-act="zoomWorld" aria-label="Ver el mundo"><span data-ico="globe"></span></button>
        </div>
        <div class="cartouche" aria-hidden="true">
          <div class="c-title">Mapa de fuga <span>· clasificado</span></div>
          <div class="scale"><i id="scaleBar"></i><span id="scaleTxt"></span></div>
          <div class="legend"><span><b class="lg-me"></b>Tú</span><span><b class="lg-trace"></b>Rastro</span><span><b class="lg-safe"></b>Casa segura</span><span><b class="lg-heat"></b>Calor</span><span><b class="lg-cop"></b>McCuack</span></div>
        </div>
      </div>

      <aside class="side">
        <section class="strip" id="strip" aria-live="polite"></section>
        <nav class="dock" id="dock" aria-label="Acciones"></nav>
        <div class="scrim" id="scrim" data-act="closeSheet" hidden></div>
        <section class="sheet" id="sheet" aria-label="Opciones"></section>
      </aside>
    </main>
  </div>

  <div class="overlay" id="ov" hidden></div>
  <div class="toast" id="toast" role="status" hidden></div>
  <div class="fx" id="fx" hidden></div>
  <div class="stamp-layer" id="stampLayer" hidden></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
